name: Garett ArduRower HR APK
on:
  push:
    paths:
      - 'android/garett-hr/**'
      - '.github/workflows/garett-hr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build and verify single APK
        run: bash android/garett-hr/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ArduRower-HR-Garett-0.1.2
          path: |
            android/garett-hr/out/ArduRower-HR-Garett-0.1.2.apk
            android/garett-hr/out/SHA256SUMS.txt
            android/garett-hr/out/signature.txt
            android/garett-hr/out/badging.txt
          if-no-files-found: error
