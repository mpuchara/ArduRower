name: ArduRower CYD - Pages installer

on:
  push:
    branches:
      - main
    paths:
      - "cyd_rower/**"
      - "ArduRower/RowerMetrics.h"
      - "ArduRower/ArduRower.ino"
      - "index.html"
      - "web/**"
      - "tests/**"
      - ".github/workflows/cyd-web-installer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ardurower-cyd-pages"
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Keep previous Garmin Connect IQ BLE contract
        run: |
          python3 tests/cyd_ble_contract_test.py
          python3 tests/cyd_display_refresh_test.py
          python3 tests/cyd_text_cache_test.py
          python3 tests/cyd_installer_integrity_test.py
          g++ -std=c++11 -Wall -Wextra -Werror tests/ghost_race_test.cpp -o /tmp/ghost_race_test
          /tmp/ghost_race_test
          g++ -std=c++11 -Wall -Wextra -Werror tests/cyd_motion_test.cpp -o /tmp/cyd_motion_test
          /tmp/cyd_motion_test
          g++ -std=c++11 -I ArduRower tests/metrics_test.cpp -o /tmp/metrics_test
          /tmp/metrics_test

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio

      - name: Compile confirmed ST7789/GPIO21 display profile
        run: |
          set -euo pipefail
          pio run -d cyd_rower -e esp32-2432s028-st7789-gpio21

      - name: Publish separate flash images while preserving NVS records
        run: python web/build_site.py

      - name: Check manifest ranges never overwrite NVS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("site")
          assert (base / "index.html").is_file()
          manifest = json.loads((base / "manifests/st7789-gpio21.json").read_text())
          build = manifest["builds"][0]
          assert build["chipFamily"] == "ESP32"
          assert manifest["new_install_prompt_erase"] is False
          version = json.loads((base / "version.json").read_text())
          assert version["version"].startswith("0.09.1-installer-")
          assert len(version["revision"]) == 12
          assert manifest["version"] == version["version"]
          parts = build["parts"]
          assert all(p["path"].endswith("-" + version["revision"] + ".bin") for p in parts)
          assert [p["offset"] for p in parts] == [0x1000, 0x8000, 0xE000, 0x10000]
          for part in parts:
              bin_file = (base / "manifests" / part["path"]).resolve()
              assert bin_file.is_file()
              length = bin_file.stat().st_size
              assert length > 0
              begin, end = part["offset"], part["offset"] + length
              assert end <= 0x400000
              assert not (begin < 0xE000 and end > 0x9000), "NVS would be overwritten"
              if begin in (0x1000, 0x10000):
                  with bin_file.open("rb") as f:
                      assert f.read(1) == b'\xe9', "Invalid ESP32 image magic"
          print("PASS: ESP Web Tools segments preserve NVS/ghost best records")
          PY

      - name: Save a backup copy of the flashable site
        uses: actions/upload-artifact@v4
        with:
          name: ardurower-cyd-web-installer
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload installer site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy from tested build artifact
        id: deployment
        uses: actions/deploy-pages@v4
