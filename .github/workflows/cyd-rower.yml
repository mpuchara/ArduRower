name: ArduRower CYD portability

on:
  push:
    paths:
      - "cyd_rower/**"
      - "ArduRower/RowerMetrics.h"
      - "ArduRower/ArduRower.ino"
      - "tests/**"
      - ".github/workflows/cyd-rower.yml"
  pull_request:
    paths:
      - "cyd_rower/**"
      - "ArduRower/RowerMetrics.h"
      - "ArduRower/ArduRower.ino"
      - "tests/**"
      - ".github/workflows/cyd-rower.yml"
  workflow_dispatch:

jobs:
  test-ble-and-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert Connect IQ / FTMS compatibility
        run: python3 tests/cyd_ble_contract_test.py
      - name: Assert flicker-free renderer and single LCD profile
        run: python3 tests/cyd_display_refresh_test.py
      - name: Check all Ghost Race text indices are within UI cache bounds
        run: python3 tests/cyd_text_cache_test.py
      - name: Check fail-closed browser installer version consistency
        run: python3 tests/cyd_installer_integrity_test.py
      - name: Assert HR receiver scanning and diagnostics
        run: python3 tests/cyd_hr_diagnostics_test.py
      - name: Assert Ghost Race navigation and HR CCCD status flow
        run: python3 tests/cyd_ghost_navigation_test.py
      - name: Test ghost racing, record integrity and timing
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/ghost_race_test.cpp -o /tmp/ghost_race_test
          /tmp/ghost_race_test
      - name: Test new reel cycle detector and calibration
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/cyd_motion_test.cpp -o /tmp/cyd_motion_test
          /tmp/cyd_motion_test
      - name: Test FTMS-first HR maintenance scheduling
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/cyd_ble_duty_test.cpp -o /tmp/cyd_ble_duty_test
          /tmp/cyd_ble_duty_test
          g++ -std=c++11 -Wall -Wextra -Werror tests/cyd_ble_coexist_test.cpp -o /tmp/cyd_ble_coexist_test
          /tmp/cyd_ble_coexist_test
          g++ -std=c++11 -Wall -Wextra -Werror tests/cyd_touch_swipe_test.cpp -o /tmp/cyd_touch_swipe_test
          /tmp/cyd_touch_swipe_test
          g++ -std=c++11 -Wall -Wextra -Werror tests/cyd_touch_state_test.cpp -o /tmp/cyd_touch_state_test
          /tmp/cyd_touch_state_test
      - name: Test unchanged rowing calculations
        run: |
          g++ -std=c++11 -I ArduRower tests/metrics_test.cpp -o /tmp/metrics_test
          /tmp/metrics_test

  build-cyd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lcd:
          - esp32-2432s028-st7789-gpio21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile CYD (${{ matrix.lcd }})
        run: pio run -d cyd_rower -e ${{ matrix.lcd }}
      - name: Verify Arduino BT retention linked (prevent 0x103 bootloop)
        run: |
          set -euo pipefail
          ELF=cyd_rower/.pio/build/esp32-2432s028-st7789-gpio21/firmware.elf
          NM="$(find "$HOME/.platformio/packages" -type f -name 'xtensa*-nm' -print -quit)"
          test -f "$ELF"
          test -n "$NM"
          test -x "$NM"
          "$NM" "$ELF" | grep -E ' T btInUse'
          "$NM" "$ELF" | grep -E ' T bleInUse'
          echo "PASS: BT memory retention hooks override Arduino defaults"
          echo "PASS: strong Arduino BT memory retention hook linked"

      - name: Publish compiled firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: ardurower-cyd-${{ matrix.lcd }}
          path: cyd_rower/.pio/build/${{ matrix.lcd }}/firmware.bin
          if-no-files-found: error
