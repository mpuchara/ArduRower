; Port ArduRower na ESP32-2432S028 (CYD 2.8" TFT).
; Konfiguracja panelu/podswietlenia pochodzi z HA_UBOX_bridge:
; firmware/cyd_monitor/platformio.ini. Nie zmieniaj profilu na slepo.
[env]
platform = espressif32
board = esp32dev
; Full CYD UI + BLE now exceeds the 1.25 MB default app partition.
; Board is serial-flashed with a complete merged image, no OTA requirement.
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=1
    -D SPI_FREQUENCY=10000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SUPPORT_TRANSACTIONS=1

; Jedyny potwierdzony na tej konkretnej plytce CYD profil: ST7789/GPIO21.
[env:esp32-2432s028-st7789-gpio21]
build_flags =
    ${env.build_flags}
    -D TFT_BL=21
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
